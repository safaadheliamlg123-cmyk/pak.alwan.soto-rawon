
name: Build C++ to EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check CPP files
        shell: pwsh
        run: |
          Write-Host "Daftar file dalam repository:"
          Get-ChildItem -Path . -Recurse

      - name: Compile C++
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path . -Filter *.cpp -Recurse -File)

          if ($files.Count -eq 0) {
            throw "File CPP tidak ditemukan!"
          }

          $source = $files[0].FullName

          Write-Host "Menggunakan file: $source"

          g++ "$source" -o program.exe -std=c++17 -O2

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-exe
          path: program.exe
