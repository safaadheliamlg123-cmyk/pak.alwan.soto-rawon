
name: Build EXE C++

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile C++
        run: cl /EHsc /std:c++17 /O2 soto.cpp /Fe:soto.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: soto-exe
          path: soto.exe
